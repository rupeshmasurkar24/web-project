<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://kit.fontawesome.com/a81368914c.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Poppins:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">    

    <link href="profile.ico" rel="icon" type="image/x-icon" />

    <link rel="stylesheet" href="style.css">
    <title> Profile Card </title>

</head>

<body>
    <div class="modal">
        <img src="img/profile.jpg" alt="">
        <div class="close"></div>
    </div>
    
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="hamburger-menu">
                    <div class="center"></div>
                </div>
                <a href="mailto:rupeshmasurkar24@gmail.com" class="mail" title="Email Rupesh">
                    <i class="far fa-envelope"></i>
                </a>
                <div class="main">
                    <div class="image">
                        <div class="hover">
                            <i class="fas fa-camera fa-2x"></i>
                        </div>
                    </div>
                    <h3 class="name"> Rupesh V. Masurkar </h3>
                    <h3 class="sub-name"> @rupesh </h3>
                </div>
            </div>

            <div class="content">
                <div class="left">
                    <div class="about-container">
                        <h3 class="title"> About Me ! </h3>
                        <p class="text"> Frontend Developer |  </p>
                    </div>
                    <div class="icons-container">
                       
                        <a href="https://www.linkedin.com/in/rupesh-masurkar/" target="_blank" rel="noopener" class="icon" title="LinkedIn">
                            <i class="fab fa-linkedin"></i>
                        </a>

                        <a href="https://github.com/rupeshmasurkar24" target="_blank" rel="noopener" class="icon" title="GitHub">
                            <i class="fab fa-github"></i>
                        </a>
                        
                        <a href="https://twitter.com/rupeshmasurkar24" target="_blank" rel="noopener" class="icon" title="Twitter">
                            <i class="fab fa-twitter"></i>
                        </a>
                        
                        <a href="https://www.instagram.com/rupesh_masurkar_/" target="_blank" rel="noopener" class="icon" title="Instagram">
                            <i class="fab fa-instagram"></i>    
                        </a>                      
                        
                        <a href="https://www.facebook.com/rupesh.masurkar/" target="_blank" rel="noopener" class="icon" title="Facebook">
                            <i class="fab fa-facebook"></i>
                        </a>
                        
                        <a href="https://hashnode.com/@RupeshMasurkar" target="_blank" rel="noopener" class="icon" title="Hashnode">
                            <i class="fa fa-rss-square" aria-hidden="true"></i>
                        </a>
                        
                        
                        
                    </div>
                    <div class="buttons-wrap">
                        <div class="follow-wrap">
                            <a href="https://www.instagram.com/rupesh_masurkar_/" target="_blank" rel="noopener" class="follow"> Follow </a>
                        </div>
                        <div class="share-wrap">
                            <a href="https://github.com/rupeshmasurkar24/My_Profile_Card" target="_blank" rel="noopener" class="share"> Fork </a>
                        </div>
                    </div>
                </div>

                <div class="right">
                    <div>
                        <h3 class="number"> 27 </h3>
                        <h3 class="number-title"> Posts </h3>
                    </div>
                    <div>
                        <h3 class="number"> 520 </h3>
                        <h3 class="number-title"> Following </h3>
                    </div>
                    <div>
                        <h3 class="number"> 1.4K </h3>
                        <h3 class="number-title"> Followers </h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
